<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Gallery</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background: linear-gradient(135deg, #1a0b2e, #2b124c, #3a1c71);
      color:#fff;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }

    canvas{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:0;
    }

    header, .filters, .gallery{
      position:relative;
      z-index:1;
    }

    /* Responsive */
    @media(max-width:1024px){
      .gallery{
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media(max-width:768px){
      .gallery{
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:480px){
      .gallery{
        grid-template-columns: 1fr;
      }
    }

    header{
      text-align:center;
      padding:60px 20px 20px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    header h1{
      font-size:85px;
      letter-spacing:2px;
      background: linear-gradient(90deg, #ff3d8d, #ff6fb1, #ffc2d1, #ffffff, #ffd6e0);
      background-size:300% 300%;
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      animation: gradientFlow 4s ease infinite;
      text-shadow:
        0 0 10px rgba(255,61,141,0.35),
        0 0 20px rgba(255,111,177,0.25),
        0 0 30px rgba(255,193,209,0.15);
    }

    @keyframes gradientFlow{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }

    header p{
      margin-top:10px;
      color: rgba(255,255,255,0.7);
    }

    .filters{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
      margin:25px;
    }

    .filters button{
      padding:10px 18px;
      border-radius:30px;
      border:1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color:#fff;
      cursor:pointer;
      backdrop-filter: blur(10px);
      transition:0.3s;
    }

    .filters button:hover,
    .filters button.active{
      background: linear-gradient(90deg,#ff8fab,#ffd1dc);
      transform:scale(1.05);
    }

    .gallery{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:10px;
      padding:20px;
      perspective:1200px;
    }

    .item{
      position:relative;
      border-radius:18px;
      overflow:hidden;
      cursor:pointer;
      background: rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      transition:0.4s ease;
      transform-style: preserve-3d;
    }

    .item img{
      width:100%;
      height:220px;
      object-fit:cover;
      transition:0.5s ease;
      display:block;
    }

    /* stronger zoom effect */
    .item:hover{
      transform: scale(1.05);
      box-shadow: 0 20px 50px rgba(255,182,193,0.25);
    }

    .item:hover img{
      transform:scale(1.2);
      filter:brightness(0.9);
    }

    .lightbox{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.85);
      display:none;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      z-index:999;
    }

    .lightbox img{
      max-width:85%;
      max-height:85%;
      border-radius:12px;
      box-shadow:0 0 40px rgba(255,182,193,0.4);
    }

    .close,.prev,.next{
      position:absolute;
      font-size:40px;
      cursor:pointer;
      color:#fff;
      user-select:none;
      transition:0.3s;
    }

    .close{
      top:20px; 
      right:30px;
    }

    .prev{
      left:20px;
      top:50%;
      transform:translateY(-50%);
    }

    .next{
      right:20px;
      top:50%;
      transform:translateY(-50%);
    }

    .prev:hover,.next:hover,.close:hover{
  color:#ff8fab;
}
  </style>
</head>
<body>

<canvas id="particles"></canvas>

<header>
  <h1>Image Gallery</h1>
  <p>Futuristic Glass Design • Smooth Animations • Immersive Experience </p>
</header>

<div class="filters">
<button class="active" onclick="filterImages('all', event)">All</button>
<button onclick="filterImages('nature', event)">Nature</button>
<button onclick="filterImages('city', event)">City</button>
<button onclick="filterImages('tech', event)">Tech</button>
</div>

<div class="gallery">
  <div class="item nature"><img src="https://plus.unsplash.com/premium_photo-1711434824963-ca894373272e?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8bmF0dXJlfGVufDB8fDB8fHww"></div>
  <div class="item city"><img src="https://images.unsplash.com/photo-1541336032412-2048a678540d?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTF8fGNpdHl8ZW58MHx8MHx8fDA%3D"></div>
  <div class="item tech"><img src="https://images.unsplash.com/photo-1488229297570-58520851e868?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzF8fHRlY2h8ZW58MHx8MHx8fDA%3D"></div>
  <div class="item nature"><img src="https://images.unsplash.com/photo-1562095241-8c6714fd4178?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fGJlYXV0aWZ1bCUyMG5hdHVyZXxlbnwwfHwwfHx8MA%3D%3D"></div>
  <div class="item city"><img src="https://media.istockphoto.com/id/2196896353/photo/smart-city-with-glowing-light-trails.webp?a=1&b=1&s=612x612&w=0&k=20&c=48Y04-yAEi-tMfDJTJFB80MoJAxsAPkjZt0UCzz9eDA="></div>
  <div class="item tech"><img src="https://plus.unsplash.com/premium_photo-1661878265739-da90bc1af051?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MzJ8fHRlY2h8ZW58MHx8MHx8fDA%3D"></div>
  <div class="item nature"><img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8bW91bnRhaW58ZW58MHx8MHx8fDA%3D"></div>
  <div class="item city"><img src="https://plus.unsplash.com/premium_photo-1673241100156-2e04fca1a4af?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8Y2l0eSUyMHN0cmVldHxlbnwwfHwwfHx8MA%3D%3D"></div>
  <div class="item tech"><img src="https://images.unsplash.com/photo-1697577418970-95d99b5a55cf?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8YXJ0aWZpY2lhbCUyMGludGVsbGlnZW5jZXxlbnwwfHwwfHx8MA%3D%3D"></div>
  <div class="item nature"><img src="https://images.unsplash.com/photo-1511497584788-876760111969?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fGZvcmVzdHxlbnwwfHwwfHx8MA%3D%3D"></div>
  <div class="item city"><img src="https://media.istockphoto.com/id/2225405260/photo/london-cityscape-with-the-gherkin-building.webp?a=1&b=1&s=612x612&w=0&k=20&c=9ZzyyfUiXJHBG0wTkA2AePTcBuDpYvf8vJuDgpcymPc="></div>
  <div class="item tech"><img src="https://images.unsplash.com/photo-1568952433726-3896e3881c65?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8N3x8dGVjaG5vbG9neXxlbnwwfHwwfHx8MA%3D%3D"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <span class="close">&times;</span>

  <span class="prev">&#10094;</span>
  <span class="next">&#10095;</span>

  <img src="" class="lightbox-img" alt="">
</div>

<script>
// particles
const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<60;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*2+1,
    dx:(Math.random()-0.5)*0.5,
    dy:(Math.random()-0.5)*0.5
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="rgba(255,182,193,0.6)";

  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();

    p.x+=p.dx;
    p.y+=p.dy;

    if(p.x<0||p.x>canvas.width) p.dx*=-1;
    if(p.y<0||p.y>canvas.height) p.dy*=-1;
  });

  requestAnimationFrame(animate);
}
animate();

function filterImages(category, event){
  let items = document.querySelectorAll('.item');

  items.forEach(item => {
    if(category === 'all'){
      item.style.display = 'block';
    } else {
      if(item.classList.contains(category)){
        item.style.display = 'block';
      } else {
        item.style.display = 'none';
      }
    }
  });

  // active button highlight
  document.querySelectorAll('.filters button')
    .forEach(btn => btn.classList.remove('active'));

  event.target.classList.add('active');
}

const items = document.querySelectorAll('.item img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.querySelector('.lightbox-img');
const closeBtn = document.querySelector('.close');
const prevBtn = document.querySelector('.prev');
const nextBtn = document.querySelector('.next');

let currentIndex = 0;

// open lightbox
items.forEach((img, index) => {
  img.addEventListener('click', () => {
    currentIndex = index;
    openLightbox();
  });
});

function openLightbox(){
  lightbox.style.display = 'flex';
  showImage();
}

function showImage(){
  lightboxImg.src = items[currentIndex].src;
}

// next
nextBtn.addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % items.length;
  showImage();
});

// prev
prevBtn.addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + items.length) % items.length;
  showImage();
});

// close
closeBtn.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

// click outside image
lightbox.addEventListener('click', (e) => {
  if(e.target === lightbox){
    lightbox.style.display = 'none';
  }
});
</script>

</body>
</html>
